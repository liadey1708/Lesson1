+<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Superhero profile card</title>
</head>
<style>
body {
    background-color: cornflowerblue;
    font-family: 'Franklin Gothic Medium';
    display: flex; 
    justify-content: center;
    align-items: center;
    min-height: 100vh;
} .card { 
    width: 500px;
   background: white;
   padding: 25px;
   border-radius: 15px;
} 
h1
{
    text-align: center;
    color: yellow;
    font-size: 60px;
    text-shadow: 4px 4px 8px orange;
} .tagline
{
    text-align: center;
    text-transform: capitalize ;
    font-size: 22px;
    color: grey;
} 
h2
{
    text-transform: uppercase;
    text-decoration: underline;
} .power
{
    color: limegreen;
    font-weight: bold;
} .weakness
{
    text-decoration: line-through;
    color: red;
} .badge
{
    width: 150px;
    margin: 20px auto;
    padding: 15px;
    text-align: center;
    background: gold;
    font-weight: gold;
    transform: rotate (-10deg);
    border-radius: 10px;
}
</style>
<body>
    <div class="card"> 
      
        <h1>Spider Man</h1>
        <p class="tagline">
            Spiderman disappeared in infinity wars
        </p>
        <h2>About</h2>
        <p>
            Spiderman is a teenage boy who lives in New York City
        </p>
        <h2>Power</h2>
        <ul>
            <li class="power"> He has spider powers </li>
            <li class="power"> He is intelligent  </li>
            <li class="power"> He can fly </li>
        </ul>
        <h2>
            Weakness
        </h2>
        <ul>
            <li class="weakness"> He is slow </li>
            <li class="weakness"> He does not trust many people </li>
        </ul>
        <div class="badge"> Old hero </div>
    </div>
</body>
</html>
