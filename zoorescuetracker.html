    <h1>Zoo Rescue Tracker</h1>
   <div class="container">

        <p><strong>animal id:</strong>z001</p>
        <p><strong>health:</strong>healthy</p>

    <div class="animal-card">
<img src="https://en.wikipedia.org/wiki/Zebra#/media/File:Plains_Zebra_Equus_quagga_cropped.jpg" alt="zebra">

        <p><strong>animal id:</strong>z002</p>

    <div class="animal-card">
        <img src="https://en.wikipedia.org/wiki/Giraffe#/media/File:Giraffe_Mikumi_National_Park.jpg" alt="Giraffe baby">

        <p><strong>animal id:</strong>z003</p>
        <p><strong>health:</strong>healthy</p>
        <p class="rescued">rescued</p>
    </div>
    <div class="animal-card">
<img src="https://en.wikipedia.org/wiki/Lion#/media/File:020_The_lion_king_Snyggve_in_the_Serengeti_National_Park_Photo_by_Giles_Laurent.jpg" alt="Lion" 
 <h2>Lion</h2>
